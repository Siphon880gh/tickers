<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Forces</title>
  <style>
    :root {
      --navy: #102438;
      --ink: #152b40;
      --muted: #56697a;
      --paper: #f2f5f8;
    }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 1rem/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      background: var(--navy);
      color: #fff;
      padding: 1.25rem 2rem;
    }
    header strong { font-size: 1.3rem; letter-spacing: -0.03em; }
    header p { margin: 0.25rem 0 0; color: #c4d6e2; }
    main { max-width: 40rem; margin: auto; padding: 2rem; }
    h1 { font-size: 1.7rem; letter-spacing: -0.03em; margin: 0 0 0.5rem; }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <strong>Market Forces</strong>
    <p>A starting point for ticker research</p>
  </header>
  <main>
    <h1>Start with what moves the market.</h1>
    <p>Choose a theme, then look up the tickers connected to it.</p>
  </main>
</body>
</html>
